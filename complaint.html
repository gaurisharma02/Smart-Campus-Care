<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - CampusCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><header>
    <h2>CampusCare</h2>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('student') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<section class="features">
    <div class="card" style="margin: auto; width: 400px;">
        <h2>Submit a Complaint</h2>
        <br>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <form action="{{ url_for('complaint') }}" method="POST" enctype="multipart/form-data">

            <label>Complaint Category</label>
            <br><br>
            <select name="category" required>
                <option value="">Select Category</option>
                <option>Electricity</option>
                <option>Water Supply</option>
                <option>Classroom</option>
                <option>Cleanliness</option>
                <option>Hostel</option>
                <option>Other</option>
            </select>

            <br><br>
            <label>Complaint Title</label>
            <br><br>
            <input type="text" name="title" placeholder="Enter complaint title" required>

            <br><br>
            <label>Description</label>
            <br><br>
            <textarea name="description" rows="4" placeholder="Describe your problem..." required></textarea>

            <br><br>
            <label>Location</label>
            <br><br>
            <input type="text" name="location" placeholder="Enter campus location" required>

            <br><br>
            <label>Upload Image (Optional)</label>
            <br><br>
            <input type="file" name="image" accept="image/*">

            <br><br>
            <button type="submit" class="btn">Submit Complaint</button>
        </form>
    </div>
</section>

</body>
</html>
